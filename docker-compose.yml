version: "3.8"

services:
  app:
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    image: diopabdoulaye/podcast:cors
    container_name: podcast_app
    env_file: .env
    ports:
      - "2000:2000"   # app NestJS exposée sur localhost:2000
    depends_on:
      - db
    networks:
      - app-network
    # command: ["node", "dist/main.js"]  # tu peux mettre "yarn start:dev" en dev

  db:
    image: postgres:15
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: ${DB0_username}
      POSTGRES_PASSWORD: ${DB0_password}
      POSTGRES_DB: ${DB0_database}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-network

  minio:
    image: minio/minio:latest
    container_name: minio
    environment:
      MINIO_ROOT_USER: ${ACCESS_KEY_MINIO_PLATEFORME}
      MINIO_ROOT_PASSWORD: ${SECRET_KEY_MINIO_PLATEFORME}
      MINIO_SERVER_URL: ${MINIO_SERVER_URL}
    ports:
      - "9003:9003"   # API S3
      - "9001:9001"   # Console web
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - app-network   
  
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "8089:80"
    volumes:
      - pgadmindata:/var/lib/pgadmin
    networks:
      - app-network    

volumes:
  pgdata:
  minio_data:
  pgadmindata:

networks:
  app-network:
    driver: bridge
